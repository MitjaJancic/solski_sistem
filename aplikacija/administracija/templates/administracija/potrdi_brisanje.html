{% extends "base.html" %}
{% block naslov %}Potrdi brisanje – Administracija – Šolski IS+{% endblock %}
{% block vsebina %}
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card shadow-sm border-danger">
        <div class="card-header bg-danger-subtle text-danger-emphasis py-3 d-flex align-items-center">
          <i class="bi bi-exclamation-triangle-fill fs-5 me-2"></i>
          <h1 class="h5 fw-bold mb-0">Potrditev brisanja</h1>
        </div>
        <div class="card-body p-4 text-center">
          <p class="fs-6 mb-3">Ali ste prepričani, da želite izbrisati zapis:</p>
          <div class="p-3 bg-body-tertiary rounded border mb-4">
            <strong class="fs-5 text-danger">{{ object }}</strong>
          </div>
          <p class="small text-muted mb-4">
            <i class="bi bi-info-circle me-1"></i>Tega dejanja po potrditvi ni mogoče razveljaviti.
          </p>
          <form method="post" class="d-flex justify-content-center gap-2">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger d-inline-flex align-items-center shadow-sm">
              <i class="bi bi-trash me-1"></i>Da, izbriši zapis
            </button>
            <a href="{{ request.META.HTTP_REFERER|default:'/' }}" class="btn btn-outline-secondary d-inline-flex align-items-center">
              <i class="bi bi-x-circle me-1"></i>Prekliči
            </a>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
