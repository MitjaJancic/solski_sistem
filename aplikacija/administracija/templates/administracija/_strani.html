{% if is_paginated %}
  <nav aria-label="Strani">
    <ul class="pagination">
      {% if page_obj.has_previous %}
        <li class="page-item"><a class="page-link" href="?page={{ page_obj.previous_page_number }}{% if q %}&q={{ q }}{% endif %}">Prejšnja</a></li>
      {% endif %}
      <li class="page-item disabled"><span class="page-link">Stran {{ page_obj.number }} od {{ page_obj.paginator.num_pages }}</span></li>
      {% if page_obj.has_next %}
        <li class="page-item"><a class="page-link" href="?page={{ page_obj.next_page_number }}{% if q %}&q={{ q }}{% endif %}">Naslednja</a></li>
      {% endif %}
    </ul>
  </nav>
{% endif %}
