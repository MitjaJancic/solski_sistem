{% extends "base.html" %}
{% block naslov %}Uredi profil – Učenec – Šolski IS+{% endblock %}
{% block vsebina %}
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-header bg-body py-3 d-flex justify-content-between align-items-center">
          <div class="d-flex align-items-center">
            <i class="bi bi-person-gear text-primary me-2 fs-5"></i>
            <h1 class="h5 fw-bold mb-0">Urejanje profila</h1>
          </div>
          <span class="badge bg-secondary-subtle text-secondary-emphasis border">Učenec</span>
        </div>
        <div class="card-body p-4">
          <p class="text-muted small mb-4">Posodobite svoje osebne podatke in kontaktni elektronski naslov.</p>

          <form method="post" novalidate>
            {% csrf_token %}
            {% include "portal/_polja.html" %}
            <div class="d-flex gap-2 mt-4">
              <button type="submit" class="btn btn-primary d-inline-flex align-items-center shadow-sm">
                <i class="bi bi-check2-circle me-1"></i>Shrani spremembe
              </button>
              <a href="{% url 'ucenec_domov' %}" class="btn btn-outline-secondary d-inline-flex align-items-center">
                <i class="bi bi-x-circle me-1"></i>Prekliči
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
