{% extends "base.html" %}
{% block naslov %}Registracija učenca – Šolski IS{% endblock %}
{% block vsebina %}

  <form method="post" novalidate class="col-lg-6">
    {% csrf_token %}
    {% include "portal/_polja.html" %}

  </form>
{% endblock %}
