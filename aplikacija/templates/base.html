{% load static %}
<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block naslov %}Šolski IS{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/slog.css' %}">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="{% url 'zacetna' %}">Šolski IS</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="{% url 'predmet_seznam' %}">Predmeti</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'ucitelj_seznam' %}">Učitelji</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'ucenec_seznam' %}">Učenci</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    {% for sporocilo in messages %}
      <div class="alert alert-{{ sporocilo.tags }} alert-dismissible fade show" role="alert">
        {{ sporocilo }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}

    {% block vsebina %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
