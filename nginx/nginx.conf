# Obrnjeni posrednik (reverse proxy) pred aplikacijskim vsebnikom.
# V razvojni fazi uporablja samopodpisano potrdilo (glej scripts/generiraj-certifikat.sh);
# na javni domeni se ssl_certificate/-key zamenjata z Let's Encrypt potrdilom (Certbot),
# server_name pa z dejansko domeno (glej dokumentacija/streznik.md, 4. poglavje).
#
# OPOMBA: namenoma NI lokacije za /media/ — naložene datoteke (gradiva, oddaje)
# niso javno dostopne, ampak jih streže Django le prek prijavljenih poti
# /prenos/... s preverjanjem pravic.

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/samopodpisano.crt;
    ssl_certificate_key /etc/nginx/certs/samopodpisano.key;

    client_max_body_size 20M;

    location / {
        proxy_pass http://aplikacija:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
