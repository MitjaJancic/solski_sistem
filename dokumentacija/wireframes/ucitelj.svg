  <text x="20" y="32" fill="#fff" font-size="18">Šolski IS</text>
  <text x="550" y="32" fill="#fff" font-size="14">Moji predmeti | Odjava</text>

  <text x="20" y="90" font-size="22" fill="#111">Pogled učitelja – Matematika</text>

  <rect x="20" y="110" width="240" height="34" rx="4" fill="#e9ecef" stroke="#333"/>
  <text x="35" y="132" font-size="13">Predmet: [ Matematika ▾ ]</text>

  <text x="20" y="175" font-size="16" font-weight="bold">Gradiva</text>
  <rect x="600" y="155" width="180" height="34" rx="4" fill="#e9ecef" stroke="#333"/>
  <text x="620" y="178" font-size="13">+ Naloži gradivo</text>

  <g font-size="13">
    <rect x="20" y="190" width="760" height="30" fill="#fff" stroke="#dee2e6"/>
