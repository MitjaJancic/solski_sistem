    <text x="700" y="210">Izbriši</text>

    <rect x="20" y="220" width="760" height="30" fill="#f8f9fa" stroke="#dee2e6"/>
    <text x="30" y="240">Vaje – kvadratne funkcije.docx</text>
    <text x="700" y="240">Izbriši</text>
  </g>

