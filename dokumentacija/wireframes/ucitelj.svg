  <text x="550" y="327" font-size="13">Oddano</text>
  <text x="680" y="327" font-size="13">Datoteka</text>

  <g font-size="13">
    <rect x="20" y="339" width="760" height="30" fill="#fff" stroke="#dee2e6"/>
