# Osnovna (produkcijska) sestava: baza, aplikacija (gunicorn) in obrnjeni
# posrednik. Za javno domeno se uporablja SAMO ta datoteka:
#   docker compose -f docker-compose.yml up -d --build
#
# Za razvoj se poleg te samodejno naloži še docker-compose.override.yml
# (runserver, adminer, priklop kode), ko poženeš samo `docker compose up`.
services:
  baza:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_GESLO}
      MARIADB_DATABASE: ${DB_IME}
      MARIADB_USER: ${DB_UPORABNIK}
      MARIADB_PASSWORD: ${DB_GESLO}
    volumes:
      - baza_podatki:/var/lib/mysql

  aplikacija:
    build: ./aplikacija
    restart: unless-stopped
    depends_on:
      - baza
    expose:
      - "8000"
    env_file: .env
    # ukaz (gunicorn) je privzet v Dockerfile; razvojni override ga zamenja

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - aplikacija
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  baza_podatki:
