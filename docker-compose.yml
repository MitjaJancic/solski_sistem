services:
  baza:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_GESLO}
      MARIADB_DATABASE: ${DB_IME}
      MARIADB_USER: ${DB_UPORABNIK}
      MARIADB_PASSWORD: ${DB_GESLO}
    volumes:
      - baza_podatki:/var/lib/mysql

  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      - baza
    ports:
      - "8081:8080"

  aplikacija:
    build: ./aplikacija
    restart: unless-stopped
    depends_on:
      - baza
    expose:
      - "8000"
    env_file: .env
    volumes:
      - ./aplikacija:/app

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - aplikacija
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  baza_podatki:
